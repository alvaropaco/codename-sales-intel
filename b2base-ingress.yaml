apiVersion: v1
kind: Service
metadata:
  name: b2base
  namespace: kube-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 3001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: b2base
  namespace: kube-system
subsets:
  - addresses:
      - ip: 172.19.0.1
    ports:
      - name: http
        port: 3001
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: b2base
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: b2base.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: b2base
                port:
                  number: 80
  tls:
    - hosts:
        - b2base.net
      secretName: b2base-tls
