version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: b2base-postgres
    environment:
      POSTGRES_USER: cnpj
      POSTGRES_PASSWORD: cnpj
      POSTGRES_DB: cnpj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnpj"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Motor de enriquecimento distribuído (specs/001-distributed-enrichment):
  # JetStream carrega o stream ENRICHMENT (subjects enrichment.>).
  nats:
    image: nats:2-alpine
    container_name: b2base-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222" # monitor HTTP do JetStream
    volumes:
      - nats_data:/data

  # Rate limit distribuído e circuit breaker por provider (ioredis).
  redis:
    image: redis:7-alpine
    container_name: b2base-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  nats_data:
  redis_data:
