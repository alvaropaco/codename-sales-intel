[project]
name = "company-enrichment-worker"
version = "0.1.0"
description = "Distributed company enrichment worker consuming NATS JetStream events"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "orjson>=3.10.0",
    "dnspython>=2.6.0",
    "aiodns>=3.2.0",
    "beautifulsoup4>=4.12.0",
    "redis>=5.0.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "docker>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# Optional OSINT recon engines for the multi-worker expansion.
# Installed into the worker image via `pip install .[osint]` (see Dockerfile).
# BBOT: primary recon engine (subdomain/DNS/emails/social/tech).
# SpiderFoot: complementary passive recon, installed from source in the
# Dockerfile (not on PyPI under a usable name), enabled by default.
osint = [
    "bbot>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_enrichment"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
