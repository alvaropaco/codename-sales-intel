{{- if .Values.infisical.enabled }}
# Syncs secrets from the existing Infisical instance into the namespace.
# Reuses the existing operator (secrets.infisical.com/v1alpha1) and the
# universal-auth credential pattern already used by other namespaces.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "company-enrichment-worker.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
spec:
  hostAPI: {{ .Values.infisical.hostAPI }}
  resyncInterval: {{ .Values.infisical.resyncInterval }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.infisical.credentialsSecretName }}
        secretNamespace: {{ .Values.infisical.credentialsSecretNamespace }}
      secretsScope:
        projectId: {{ .Values.infisical.projectId | quote }}
        envSlug: {{ .Values.infisical.envSlug }}
        secretsPath: {{ .Values.infisical.secretsPath | quote }}
        recursive: false
  managedKubeSecretReferences:
    - secretName: {{ .Values.infisical.managedSecretName }}
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
      secretType: Opaque
{{- end }}
