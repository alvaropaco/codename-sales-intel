{{- if .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "company-enrichment-worker.fullname" . }}-dashboard
  namespace: {{ .Values.monitoring.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "company-enrichment-worker.labels" . | nindent 4 }}
    # Grafana sidecar auto-imports ConfigMaps with this label (NAMESPACE=ALL).
    {{ .Values.monitoring.dashboard.sidecarLabel }}: "{{ .Values.monitoring.dashboard.sidecarLabelValue }}"
data:
  company-enrichment-worker.json: |-
{{ .Files.Get "dashboards/company-enrichment-worker.json" | indent 4 }}
{{- end }}
