{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "company-enrichment-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "company-enrichment-worker.labels" . | nindent 4 }}
    # Picked up by the kube-prometheus-stack Prometheus (serviceMonitorSelector).
    release: {{ .Values.monitoring.prometheusRelease }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "company-enrichment-worker.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
