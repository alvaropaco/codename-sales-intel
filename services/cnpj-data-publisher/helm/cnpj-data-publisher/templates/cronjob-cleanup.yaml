{{- if .Values.cleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-cleanup" (include "cnpj-data-publisher.fullname" .) }}
  labels:
    {{- include "cnpj-data-publisher.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  {{- with .Values.cleanup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "cnpj-data-publisher.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cleanup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "cnpj-data-publisher.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: cleanup
              image: {{ include "cnpj-data-publisher.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["cleanup"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                {{- include "cnpj-data-publisher.envVars" . | nindent 16 }}
              envFrom:
                {{- include "cnpj-data-publisher.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources.migrations | nindent 16 }}
              volumeMounts:
                {{- include "cnpj-data-publisher.volumeMounts" . | nindent 16 }}
          volumes:
            {{- include "cnpj-data-publisher.volumes" . | nindent 12 }}
{{- end }}
