{{- if .Values.ingestor.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-ingestor" (include "cnpj-data-publisher.fullname" .) }}
  labels:
    {{- include "cnpj-data-publisher.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestor
spec:
  schedule: {{ .Values.ingestor.schedule | quote }}
  {{- with .Values.ingestor.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .Values.ingestor.concurrencyPolicy }}
  {{- with .Values.ingestor.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  successfulJobsHistoryLimit: {{ .Values.ingestor.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ingestor.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.ingestor.backoffLimit }}
      {{- with .Values.ingestor.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "cnpj-data-publisher.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: ingestor
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "cnpj-data-publisher.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: ingestor
              image: {{ include "cnpj-data-publisher.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              ports:
                - name: metrics
                  containerPort: {{ .Values.config.metricsPort }}
              {{- if .Values.ingestor.embed.enabled }}
              # Monthly chain: ingest, then embed + coverage report in the
              # same pod. `monthly` exits non-zero if any stage fails or rows
              # remain pending, so backoffLimit retries converge the backlog
              # (both stages are idempotent/resumable).
              args:
                - monthly
                - --snapshot
                - {{ .Values.ingestor.snapshot | quote }}
                {{- if .Values.ingestor.embed.createIndex }}
                - --create-index
                {{- end }}
                {{- if .Values.ingestor.force }}
                - --force
                {{- end }}
                {{- with .Values.ingestor.extraArgs }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- else }}
              args:
                - ingest
                - --snapshot
                - {{ .Values.ingestor.snapshot | quote }}
                {{- if .Values.ingestor.force }}
                - --force
                {{- end }}
                {{- with .Values.ingestor.extraArgs }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                {{- include "cnpj-data-publisher.envVars" . | nindent 16 }}
                {{- if .Values.ingestor.embed.enabled }}
                {{- /* The chained `monthly` runs the embed stage in this pod,
                        so it needs the same endpoint settings as the repair
                        embedder CronJob. */}}
                {{- with .Values.embedder.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- end }}
              envFrom:
                {{- include "cnpj-data-publisher.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources.ingestor | nindent 16 }}
              volumeMounts:
                {{- include "cnpj-data-publisher.volumeMounts" . | nindent 16 }}
          volumes:
            {{- include "cnpj-data-publisher.volumes" . | nindent 12 }}
          {{- with .Values.ingestor.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingestor.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
