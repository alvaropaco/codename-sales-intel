name: cnpj-data-publisher

x-app-env: &app-env
  APP_ENV: development
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  DATABASE_URL: postgresql+psycopg://cnpj:cnpj@postgres:5432/cnpj
  NATS_URL: nats://nats:4222
  NATS_STREAM: BRAZIL_COMPANY_EVENTS
  NATS_SUBJECT_PREFIX: company.br.cnpj
  STORAGE_BACKEND: LOCAL
  STORAGE_LOCAL_PATH: /data
  INITIAL_SNAPSHOT_MODE: STORE_ONLY
  METRICS_PORT: "9090"
  HEALTH_PORT: "8080"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cnpj
      POSTGRES_USER: cnpj
      POSTGRES_PASSWORD: cnpj
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnpj -d cnpj"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "${NATS_PORT:-54222}:4222"
      - "${NATS_MONITOR_PORT:-58222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply database migrations.
  migrate:
    build: .
    profiles: ["tools"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/data
    command: ["migrate"]

  # Generic runner: docker compose run --rm app ingest --snapshot latest
  app:
    build: .
    profiles: ["tools"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - app_data:/data
    command: ["--help"]

  outbox-publisher:
    build: .
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${HEALTH_PORT:-58080}:8080"
      - "${METRICS_PORT:-59090}:9090"
    volumes:
      - app_data:/data
    command: ["publish-outbox"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional ingestion profile: docker compose --profile ingest up ingestor
  ingestor:
    build: .
    profiles: ["ingest"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - app_data:/data
    command: ["ingest", "--snapshot", "latest"]

  # Optional S3-compatible object storage.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nats_data:
  app_data:
  minio_data:
